name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Avant setup-node : celui-ci a besoin de pnpm pour resoudre son cache.
      # La version est lue dans le champ packageManager de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # biome ci n'ecrit rien : il sort en erreur si un fichier n'est pas
      # conforme. Place avant les tests pour rendre la main en quelques secondes.
      - run: pnpm check:ci

      # Execute les tests et applique les seuils de couverture : sous le seuil,
      # vitest sort en erreur et la gate bloque.
      - run: pnpm test:coverage

      - run: pnpm build

      # Ce qui part en prod est le bundle qui vient de passer les tests, et non
      # un rebuild : le job deploy recupere cet artefact tel quel.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: deploy
    needs: ci
    # Jamais sur une pull request : la garde est fausse, le job apparait skipped
    # et ne bloque rien. La gate de merge reste le job ci seul.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # En premier : checkout nettoie le workspace. Place apres le telechargement
      # de l'artefact, il effacerait le dist/ qu'on vient de recuperer. Il n'est
      # la que pour donner acces au .nvmrc, seule source de la version de Node.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # --no-build : Netlify ne construit rien ici, il recoit un dist/ deja bati.
      - run: npx --yes netlify-cli@27 deploy --prod --dir=dist --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
