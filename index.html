<!-- Lancée depuis l'écran d'accueil, l'app s'ouvre sans la barre Safari.
     La barre de statut reste opaque : rien dans les styles ne gère les
     encoches (safe-area), du contenu passerait dessous en translucide. -->

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="5 langages">

<!-- L'aperçu des liens partagés (WhatsApp, iMessage, Slack) exige une URL
     absolue pour l'image : un chemin relatif n'est pas résolu par les robots. -->
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
